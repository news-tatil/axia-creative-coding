<!DOCTYPE html>
<html lang="">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AXIA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap');

        body {
            padding: 0px;
            margin: 0px;
            font-family: "DM Sans", Tahoma, Geneva, Verdana, sans-serif !important;
            font-variation-settings: "wght" 400;
        }

        .main {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            height: 100vh;
            justify-content: center;
            align-items: center;
            align-content: center;
            background: #0000FF;
            gap: 50px;
        }

        a.btn {
            font-size: 22px;
            padding: 12px 22px;
            background-color: #fff;
            color: #0000FF;
            border-radius: 16px;
            text-decoration: none;
            min-width: 220px;
            text-align: center;
            transition: all ease 0.3s;
        }

        a.btn:hover {
            color: #000;
            transform: scale(1.005);
        }
    </style>
</head>

<body>
    <main class="main">
        <a href="./illustration.html" class="btn">Illustration</a>
        <a href="./symbol.html" class="btn">Symbol</a>
    </main>
</body>

</html>
